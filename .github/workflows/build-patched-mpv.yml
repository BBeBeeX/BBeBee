name: Build Patched libmpv (All Platforms)

on:
  workflow_dispatch:
    inputs:
      mpv_version:
        description: 'mpv git tag or branch to build'
        required: true
        default: 'v0.41.0'

jobs:
  build-linux:
    name: Build Patched libmpv (Linux x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            python3 \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libswscale-dev \
            libass-dev \
            libplacebo-dev \
            libasound2-dev \
            libpulse-dev \
            libpipewire-0.3-dev \
            libluajit-5.1-dev \
            libuchardet-dev

      - name: Build Patched libmpv
        run: |
          bash scripts/build-patched-mpv.sh linux "${{ github.event.inputs.mpv_version || 'v0.41.0' }}" output/linux


      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-patched-linux
          path: output/linux/

  build-macos:
    name: Build Patched libmpv (macOS universal/arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies via Homebrew
        run: |
          brew update
          brew install meson ninja pkg-config ffmpeg libass libplacebo uchardet luajit

      - name: Build Patched libmpv
        run: |
          bash scripts/build-patched-mpv.sh macos "${{ github.event.inputs.mpv_version || 'v0.41.0' }}" output/darwin

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-patched-darwin
          path: output/darwin/

  build-windows:
    name: Build Patched libmpv (Windows win64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-libass
            mingw-w64-x86_64-libplacebo
            mingw-w64-x86_64-uchardet
            mingw-w64-x86_64-luajit

      - name: Build Patched libmpv
        shell: msys2 {0}
        run: |
          bash scripts/build-patched-mpv.sh windows "${{ github.event.inputs.mpv_version || 'v0.41.0' }}" output/win64

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-patched-win64
          path: output/win64/

  package-all:
    name: Package All Platforms (Combined Archive)
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: libmpv-patched-linux
          path: staging/libmpv/linux

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: libmpv-patched-darwin
          path: staging/libmpv/darwin

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: libmpv-patched-win64
          path: staging/libmpv/win64

      - name: Assemble libmpv directory structure
        run: |
          if [ -f apps/desktop/resources/libmpv/README.md ]; then
            cp apps/desktop/resources/libmpv/README.md staging/libmpv/
          fi
          if [ -f apps/desktop/resources/libmpv/darwin/README.md ]; then
            cp apps/desktop/resources/libmpv/darwin/README.md staging/libmpv/darwin/
          fi
          echo "=== Staged libmpv directory structure ==="
          ls -la staging/libmpv/
          ls -la staging/libmpv/darwin/ || true
          ls -la staging/libmpv/linux/ || true
          ls -la staging/libmpv/win64/ || true

      - name: Create Combined Zip Archive
        run: |
          cd staging
          zip -r ../libmpv-all-platforms.zip libmpv/
          cd ..
          ls -lh libmpv-all-platforms.zip

      - name: Upload Combined Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-all-platforms
          path: libmpv-all-platforms.zip
