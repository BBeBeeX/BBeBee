[package]
name = "desktop-tauri"
version = "0.0.0"
description = "BBeBee Desktop Tauri Host"
authors = ["BBeBee"]
edition = "2021"

[lib]
name = "desktop_tauri_lib"
path = "src/lib.rs"

[[bin]]
name = "desktop-tauri"
path = "src/main.rs"

[[bin]]
name = "poc_wayland"
path = "src/bin/poc_wayland.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "process", "io-util", "sync", "rt-multi-thread"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
