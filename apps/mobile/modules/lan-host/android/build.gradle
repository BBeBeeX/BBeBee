plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.lanhost'
version = '0.1.0'

android {
  namespace "expo.modules.lanhost"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Outbound peer requests. OkHttp ships with React Native's networking
  // stack; pinning the same artifact family the app already carries keeps
  // this module from pulling a second, competing copy into the APK.
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
