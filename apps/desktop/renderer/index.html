<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Strict CSP. `BBeBee-plugin:` is listed ahead of M5's dynamic loader
         (docs/03 §6.2) so the policy does not have to change to enable it.
         `'wasm-unsafe-eval'` is what lets QuickJS compile, and is not
         `'unsafe-eval'`: no foreign JavaScript loads (docs/02 §2).
         `http:` in img-src mirrors media-src/connect-src: some sources serve
         artwork from plain-http hosts, and a blocked cover is a worse outcome
         than the (passive, non-script) load it enables. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' BBeBee-plugin:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: bbebee-file: http: https:; media-src 'self' blob: data: http: https: bbebee-file:; connect-src 'self' ws: wss: http: https:"
    />
    <script type="module" src="./window-init.ts"></script>
    <title>BBeBee</title>
    <link rel="icon" type="image/png" href="./assets/logo-badge.png" />
    <style>
      @font-face {
        font-family: 'CinematicCursive';
        src: local('Caveat'),
             local('Segoe Print'),
             local('Bradley Hand'),
             local('Chalkboard SE'),
             local('Z003'),
             local('URW Chancery L');
        font-display: swap;
      }

      :root {
        color-scheme: dark;

        /* ── Layer 1: Primitives (Bee Character Visual Spectrum) ── */
        --black-950: #05060A;
        --black-900: #080A10;
        --black-850: #0B0E16;
        --black-800: #0F121C;

        --white-100: #FFFFFF;
        --white-90: rgba(255, 255, 255, 0.90);
        --white-75: rgba(255, 255, 255, 0.75);
        --white-55: rgba(255, 255, 255, 0.55);
        --white-35: rgba(255, 255, 255, 0.35);

        --ice-blue-100: #EAF1FF;
        --ice-blue-200: #D4E2FF;
        --ice-blue-300: #B7CCFF;
        --ice-blue-400: #91B0FF;
        --ice-blue-500: #7598FF;

        --electric-blue-400: #6F9BFF;
        --electric-blue-500: #5F87FF;
        --electric-blue-600: #4F73FF;

        --periwinkle-400: #8996FF;
        --periwinkle-500: #7C86FF;
        --periwinkle-600: #6E75F5;

        --lavender-300: #D4CCFF;
        --lavender-400: #BEB4FF;
        --lavender-500: #A99CFF;
        --lavender-600: #9687FF;

        --violet-400: #B28CFF;
        --violet-500: #9B73F5;
        --violet-600: #875EE8;

        --deep-blue-950: #080D1A;
        --deep-blue-900: #0B1124;
        --deep-blue-800: #101831;
        --deep-blue-700: #162142;

        /* ── Layer 2: Semantic Colors ── */
        --color-bg-app: var(--black-950);
        --color-bg-primary: var(--black-900);
        --color-bg-secondary: var(--deep-blue-950);
        --color-bg-tertiary: var(--deep-blue-900);

        --color-surface: var(--deep-blue-900);
        --color-surface-hover: var(--deep-blue-800);
        --color-surface-active: var(--deep-blue-700);
        --color-surface-selected: rgba(117, 152, 255, 0.12);

        --color-text-primary: var(--white-100);
        --color-text-secondary: var(--white-75);
        --color-text-tertiary: var(--white-55);
        --color-text-muted: var(--white-35);
        --color-text-disabled: rgba(255, 255, 255, 0.22);

        --color-primary: var(--electric-blue-500);
        --color-primary-hover: var(--ice-blue-400);
        --color-primary-active: var(--periwinkle-500);

        --color-accent: var(--lavender-500);
        --color-accent-hover: var(--lavender-400);

        --color-playing: var(--lavender-400);
        --color-lyrics: var(--ice-blue-300);
        --color-lyrics-active: var(--lavender-300);
        --color-lyrics-highlight: var(--ice-blue-200);
        --color-waveform: var(--electric-blue-400);
        --color-waveform-active: var(--lavender-400);

        /* Base Variables (mapped) */
        --bg-app: var(--color-bg-app);
        --bg-primary: var(--color-bg-primary);
        --bg-secondary: var(--color-bg-secondary);
        --bg-tertiary: var(--color-bg-tertiary);

        --surface-1: var(--deep-blue-950);
        --surface-2: var(--deep-blue-900);
        --surface-3: var(--deep-blue-800);
        --surface-hover: var(--color-surface-hover);
        --surface-active: var(--color-surface-active);
        --surface-selected: var(--color-surface-selected);

        --primary: var(--color-primary);
        --primary-active: var(--color-primary-active);
        --primary-hover: var(--color-primary-hover);

        --accent: var(--color-accent);
        --accent-hover: var(--color-accent-hover);

        /* Gradients (Continuous Spectral Flow) */
        --gradient-brand: linear-gradient(135deg, #5F87FF 0%, #7C86FF 45%, #9687FF 75%, #A99CFF 100%);
        --gradient-blue-violet: linear-gradient(90deg, #5F87FF 0%, #7C86FF 50%, #A99CFF 100%);
        --gradient-ice: linear-gradient(135deg, #91B0FF 0%, #BEB4FF 50%, #D4CCFF 100%);
        --gradient-progress: linear-gradient(90deg, #4F73FF 0%, #6F9BFF 35%, #8996FF 65%, #B28CFF 100%);
        --gradient-spectrum: linear-gradient(90deg, #4F73FF, #6F9BFF, #8996FF, #A99CFF, #B28CFF);

        /* Text Variables */
        --text-primary: var(--color-text-primary);
        --text-secondary: var(--color-text-secondary);
        --text-tertiary: var(--color-text-tertiary);
        --text-muted: var(--color-text-muted);
        --text-disabled: var(--color-text-disabled);
        --text-placeholder: var(--white-35);

        /* Border */
        --border-subtle: rgba(145, 176, 255, 0.08);
        --border-default: rgba(145, 176, 255, 0.14);
        --border-hover: rgba(145, 176, 255, 0.25);
        --border-active: rgba(117, 152, 255, 0.40);
        --border-focus: rgba(117, 152, 255, 0.50);

        /* Semantic Status */
        --success: #22C55E;
        --warning: #F59E0B;
        --error: #EF4444;
        --info: #7598FF;

        /* Music Tokens */
        --music-playing: var(--color-playing);
        --music-lyrics: var(--color-lyrics);
        --music-waveform: var(--color-waveform);
        --music-waveform-active: var(--color-waveform-active);

        /* Glow System (Wing / Headphone / Note luminescence) */
        --glow-blue-xs: 0 0 6px rgba(117, 152, 255, 0.25);
        --glow-blue-sm: 0 0 12px rgba(117, 152, 255, 0.20);
        --glow-blue-md: 0 0 20px rgba(117, 152, 255, 0.28);

        --glow-purple-xs: 0 0 6px rgba(169, 156, 255, 0.25);
        --glow-purple-sm: 0 0 12px rgba(169, 156, 255, 0.20);
        --glow-purple-md: 0 0 20px rgba(169, 156, 255, 0.28);

        --glow-brand-sm: 0 0 12px rgba(117, 152, 255, 0.18), 0 0 24px rgba(169, 156, 255, 0.10);
        --glow-brand-md: 0 0 18px rgba(117, 152, 255, 0.22), 0 0 36px rgba(169, 156, 255, 0.14);

        --glow-xs: var(--glow-blue-xs);
        --glow-sm: var(--glow-brand-sm);
        --glow-md: var(--glow-brand-md);
        --glow-lg: 0 0 28px rgba(117, 152, 255, 0.25), 0 0 48px rgba(169, 156, 255, 0.16);

        /* ── Layer 3: Component Tokens ── */
        --button-primary-bg: var(--gradient-brand);
        --button-primary-hover: var(--gradient-ice);
        --button-primary-text: #FFFFFF;

        --player-bg: var(--bg-app);
        --player-progress: var(--gradient-progress);
        --player-playing: var(--lavender-400);

        --slider-track: rgba(255, 255, 255, 0.10);
        --slider-track-bg: var(--gradient-progress);
        --slider-active: var(--gradient-progress);
        --slider-thumb: var(--ice-blue-300);

        --waveform-idle: rgba(117, 152, 255, 0.35);
        --waveform-active: var(--gradient-spectrum);

        --lyrics-normal: rgba(255, 255, 255, 0.45);
        --lyrics-active: var(--lavender-300);
        --lyrics-highlight: var(--ice-blue-200);

        --sidebar-bg: var(--black-900);
        --sidebar-item-hover: rgba(117, 152, 255, 0.07);
        --sidebar-item-active: rgba(169, 156, 255, 0.12);
        --sidebar-active-indicator: var(--gradient-brand);

        --card-bg: var(--deep-blue-950);
        --card-hover: var(--deep-blue-900);
        --card-border: rgba(145, 176, 255, 0.10);
        --card-border-hover: rgba(145, 176, 255, 0.25);

        --tab-text: var(--white-55);
        --tab-text-active: var(--ice-blue-200);
        --tab-indicator: var(--gradient-brand);

        --input-bg: rgba(255, 255, 255, 0.035);
        --input-border: rgba(145, 176, 255, 0.10);
        --input-focus-border: rgba(117, 152, 255, 0.50);
        --input-focus-glow: var(--glow-blue-sm);

        --playing-item-bg: rgba(117, 152, 255, 0.06);
        --playing-item-border: rgba(169, 156, 255, 0.18);
        --playing-item-indicator: var(--gradient-brand);
        --playing-item-glow: var(--glow-brand-sm);
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      :root {
        background-color: var(--bg-app, #05060A);
        background: var(--bg-app, #05060A);
      }
      html, body {
        width: 100%;
        height: 100%;
        min-height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 0;
        border: none;
        outline: none;
        overflow: hidden;
        background-color: var(--bg-app, #05060A);
        background: var(--bg-app, #05060A);
        color: var(--text-primary);
        font-family: system-ui, sans-serif;
      }
      #root {
        width: 100%;
        height: 100%;
        min-height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 0;
        border: none;
        outline: none;
        overflow: hidden;
        background-color: var(--bg-app, #05060A);
        background: var(--bg-app, #05060A);
      }
      html.is-mini-player-window,
      html.is-mini-player-window body,
      html.is-mini-player-window #root,
      html.is-lyrics-window,
      html.is-lyrics-window body,
      html.is-lyrics-window #root {
        background: transparent !important;
        background-color: transparent !important;
      }

      /* Global sleek auto-hiding scrollbars: a pane's thumb shows only while the
         pointer is over that pane (`is-scrollbar-hover`, set from main.tsx) or
         while that pane itself is scrolling (`is-scrolling`, 1.2s linger). Every
         other pane's scrollbar stays hidden.
         ⚠️ Two dead ends, do not revisit: standard `scrollbar-width`/`scrollbar-color`
         make Chromium 121+ discard every `::-webkit-scrollbar` rule below, and a
         `*:hover::-webkit-scrollbar-thumb` selector is honored for *no* pane —
         Chromium evaluates scrollbar part styles without the owner element's
         `:hover` state, which lit every pane's thumb at all times. Only plain
         classes on the scroll container reach the cascade. */
      *::-webkit-scrollbar {
        width: 4px;
        height: 4px;
        background: transparent;
      }
      *::-webkit-scrollbar-track,
      *::-webkit-scrollbar-track-piece,
      *::-webkit-scrollbar-corner {
        background: transparent;
      }
      *::-webkit-scrollbar-thumb {
        background-color: transparent;
        border-radius: 4px;
        transition: background-color 0.3s ease;
      }
      *.is-scrollbar-hover::-webkit-scrollbar-thumb,
      *.is-scrolling::-webkit-scrollbar-thumb {
        background-color: rgba(145, 176, 255, 0.25);
      }
      *.is-scrollbar-hover::-webkit-scrollbar-thumb:hover {
        background-color: rgba(117, 152, 255, 0.55);
      }
      *.is-scrollbar-hover::-webkit-scrollbar-thumb:active {
        background-color: rgba(117, 152, 255, 0.75);
      }

      /* Global progress & slider bars: thin track, thumb only visible on hover */
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        height: 12px;
        background: transparent;
        cursor: pointer;
        outline: none;
        margin: 0;
        padding: 0;
        vertical-align: middle;
      }
      input[type="range"]::-webkit-slider-runnable-track {
        height: 3px;
        border-radius: 1.5px;
        background: var(--slider-track-bg, rgba(255, 255, 255, 0.2));
        transition: height 0.15s ease;
      }
      input[type="range"]:hover::-webkit-slider-runnable-track,
      input[type="range"]:active::-webkit-slider-runnable-track,
      input[type="range"].is-dragging::-webkit-slider-runnable-track {
        height: 3.5px;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background-color: #FFFFFF;
        margin-top: -3.5px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
        opacity: 0;
        transition: opacity 0.15s ease, transform 0.15s ease;
      }
      input[type="range"]:hover::-webkit-slider-thumb,
      input[type="range"]:active::-webkit-slider-thumb,
      input[type="range"]:focus-visible::-webkit-slider-thumb,
      input[type="range"].is-dragging::-webkit-slider-thumb {
        opacity: 1;
      }

      /* Immersive panes scroll when they must, but never show a scrollbar. */
      .no-scrollbar { scrollbar-width: none; }
      .no-scrollbar::-webkit-scrollbar { display: none; }

      /* ── Startup Splash Screen ── */
      #splash-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: var(--black-950, #05060A);
        z-index: 99999;
        user-select: none;
        -webkit-app-region: drag;
      }

      .splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .splash-logo {
        width: 72px;
        height: 72px;
        object-fit: contain;
        filter: drop-shadow(0 0 12px rgba(111, 155, 255, 0.15));
        animation: splash-pulse 3.6s ease-in-out infinite;
      }

      @keyframes splash-pulse {
        0%, 100% {
          transform: scale(1);
          opacity: 0.82;
          filter: drop-shadow(0 0 12px rgba(111, 155, 255, 0.15));
        }
        50% {
          transform: scale(1.025);
          opacity: 0.96;
          filter: drop-shadow(0 0 22px rgba(111, 155, 255, 0.28));
        }
      }

      .is-lyrics-window #splash-screen,
      .is-mini-player-window #splash-screen {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash-screen">
        <div class="splash-content">
          <img src="./assets/logo-badge.png" class="splash-logo" alt="BBeBee Logo" />
        </div>
      </div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
